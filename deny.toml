# cargo-deny configuration for theSix.
# https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]

[graph]
# Audit the graph CI actually builds.
#
# Without this, `cargo deny` resolves *default* features only, so the oxigraph
# rung's dependency tree -- and the two quick-xml advisories below -- are simply
# absent from the check, and the waivers read as stale entries rather than as
# deliberate decisions. Auditing default features only is the same as auditing a
# build nobody ships.
all-features = true

[advisories]
# Fail on any known security advisory in the dependency tree.
yanked = "deny"
# `fxhash` (via sled) and `instant` (via sled -> parking_lot) are flagged as
# unmaintained but carry no vulnerability and have no maintained drop-in for
# sled 0.34. Flag unmaintained only for workspace crates, not transitive deps.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.37.5, reached only as oxrdfxml -> oxrdfio -> oxigraph under
    # `--all-features`. Two advisories, both in namespace resolution:
    #   RUSTSEC-2026-0194 duplicate-start-tag check
    #   RUSTSEC-2026-0195 unbounded `NamespaceResolver::push` allocation
    #
    # Not fixable in-tree: `oxrdfxml` pins `quick-xml = "0.37"` and the patched
    # release is `>= 0.41.0`, so there is no in-semver upgrade to take.
    #
    # Not reachable: `cargo tree` shows zero `quick-xml` nodes for the default
    # feature set, for `--features oxigraph`, and for
    # `--features redis,sled,oxigraph`. It appears only under `--all-features`,
    # which additionally enables oxigraph's own optional features that thesix does
    # not use. `L5OxigraphBackend` never touches XML - it calls `Store::new`,
    # `insert`, `remove` and `quads_for_pattern`, and hex-encodes keys and values
    # rather than parsing them - so there is no XML input to be unbounded on.
    #
    # Revisit when oxigraph bumps its `oxrdfxml` pin past 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 is pinned transitively by oxrdfxml; unreachable from any thesix feature, and thesix never parses XML" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37 is pinned transitively by oxrdfxml; unreachable from any thesix feature, and thesix never parses XML" },
]

[bans]
# Reject duplicate versions of the same crate where avoidable.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency with no version is not a wildcard dependency: it names one
# specific crate in this repository, and cargo strips it from the published
# manifest entirely. `testkit` and `xtask` are both dev-only and in-tree, so the
# wildcard rule has nothing to protect against there — and flagging them would
# mean loosening the rule for every real dependency too.
allow-wildcard-paths = true

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
