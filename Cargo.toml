[package]
name = "thesix"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
description = "Policy-driven six-tier cache orchestration for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Metis-Avionics/theSix"
homepage = "https://github.com/Metis-Avionics/theSix"
exclude = [
    ".kilo/**",
    "specs/**",
    "target/**",
    "*.lock",
    ".gitignore",
    ".github/**",
    "living.toml",
    "AGENTS.md",
    "deny.toml",
]

keywords = [
    "cache",
    "caching",
    "concurrency",
    "async",
    "systems"
]

categories = [
    "caching",
    "concurrency",
    "asynchronous"
]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
criterion = "0.5"

[features]
default = []
redis = ["dep:redis"]
sled = ["dep:sled"]

[dependencies.redis]
version = "0.24"
optional = true

[dependencies.sled]
version = "0.34"
optional = true
