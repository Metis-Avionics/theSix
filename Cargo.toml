[package]
name = "thesix"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Policy-driven six-tier cache orchestration for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Metis-Avionics/theSix"
homepage = "https://github.com/Metis-Avionics/theSix"
exclude = [
    ".kilo/**",
    "specs/**",
    "target/**",
    "*.lock",
    ".gitignore",
    ".github/**",
    "living.toml",
    "AGENTS.md",
    "deny.toml",
]

keywords = [
    "cache",
    "caching",
    "concurrency",
    "async",
    "systems"
]

categories = [
    "caching",
    "concurrency",
    "asynchronous"
]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"
async-trait = "0.1"
# default-features = false is load-bearing: oxigraph defaults to `rocksdb`, which
# would drag the C++ toolchain back in for a backend whose whole point is
# avoiding that. Without it the store is in-process.
oxigraph = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
criterion = "0.5"
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "temporal", "fmt"] }

[features]
default = []
oxigraph = ["dep:oxigraph"]
redis = ["dep:redis"]
sled = ["dep:sled"]

[dependencies.redis]
version = "0.24"
optional = true

[dependencies.sled]
version = "0.34"
optional = true
