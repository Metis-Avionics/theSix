[[strength]]
id = "S1"
area = "test architecture"
assessment = "excellent"
detail = """
The anti-vacuity discipline is the strongest part of the branch: asking whether
the fault fired, whether the stall stalled, whether the corruption corrupted,
rather than asserting `is_err()`. Coverage registries compared for equality
against the contract mean a required case cannot be silently dropped.
"""

[[strength]]
id = "S2"
area = "control/data-plane boundary"
assessment = "strong"
detail = """
Control plane -> owned snapshot -> release mutex -> await data plane, rather than
holding a shard guard across an await. The `Notified::enable()` ordering is real
race investigation: register before deciding to wait, then re-read.
"""

[[strength]]
id = "S3"
area = "L6 authority isolation"
assessment = "strong"
detail = """
`last_cache_tier = L5` with authority as a configured role, and a fail-open scan
bounded to the ladder. This forecloses the failure mode where an unavailable L5
causes the authority rung to be queried and authority data surfaced as cache
data — a violation that survives ordinary functional testing.
"""

[[strength]]
id = "S4"
area = "capability model and explicit contract"
assessment = "strong"
detail = """
Three orthogonal axes rather than one enum, and `theSix.toml` machine-checked
against the crate by `tests/contract` instead of asserted in prose.
"""

# ---------------------------------------------------------------------------
# HONEST CAVEAT
# ---------------------------------------------------------------------------
#
# Three of the blocking findings are contradictions between `theSix.toml` and the
# runtime. `cargo xtask contract` passes today because it checks the contract
# against the *runner and test inventory*, not against runtime behaviour. So the
# gate is green while B1, B2 and B3 are open. That is a real limitation of the
# current gate design, not a claim that the findings are minor.

[gate_coverage_gap]
summary = """
`cargo xtask contract` verifies that the declared architecture matches the runner
and the test inventory. It does not verify that the runtime honours the declared
invariants. `cancel_safe`, `partial_commit_visible`,
`cancelled_operation_may_commit_partially` and `recovery_direction_prepare_move`
are all declared `true`/complete-forward and are all currently false in the
implementation.
"""
implication = """
A green gate run is not evidence against B1, B2 or B3. It is evidence that the
contract is internally consistent and fully covered by declared targets.
"""
possible_followups = [
  "Have `tests/contract` assert that every clause in `theSix.toml` marked as a runtime guarantee has a corresponding test registered in the coverage registries, so a clause with no proving test is a contract failure rather than a documentation gap.",
  "Register B1-B3 in `theSix.toml` as known deviations with an explicit `known_deviation` marker, so the contract states them rather than the prose docs doing it.",
  "Gate on this file: assert no `blocks_merge = true` entry is `status = \"open\"` before release, so the tracker cannot drift from the gates.",
]
not_done = """
None of the above are implemented. They are recorded as options because
`bugs.toml` is currently a note, and a note that silently grew enforcement
semantics would misrepresent what the gates actually check.
"""