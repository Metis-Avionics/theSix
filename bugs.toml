# ---------------------------------------------------------------------------
# BLOCKING
# ---------------------------------------------------------------------------

[[bug]]
id = "B1"
title = "set() has no RAII guard on its commit intent, so cancellation wedges the key"
severity = "blocking"
status = "resolved"
resolved_at = "2026-10-04"
accepted_by = "leo"
rationale = """
Fixed by `IntentGuard`, an RAII guard held across the write await in both `set`
and the move path. Its Drop aborts the token; `abort` is idempotent, declines when
a commit already won, and restores the state the intent interrupted. Two regression
tests in tests/recovery, both confirmed to fail against the pre-fix code.

The symptom was narrower than first reported. `set` was never wedged, because
`prepare` has no claimability precondition and a second write simply re-prepares
over the abandoned intent. `get` was never wedged either; it reports Miss on a
Prepared entry. Only `get_or_fetch` wedged: it must claim the entry to populate it,
`acquire` declines while `population_owner` is set, and the caller burned the full
timeout as a waiter against an owner that would never arrive.

Fixing the move path also closed two leaks that were not cancellation-related and
were not in the original report: the unbound-tier check and the key re-encode both
returned while the entry was still Prepared.
"""
verified = true
blocks_merge = true
locations = ["src/manager.rs:94", "src/manager.rs:853", "src/manager.rs:1140", "src/control/cachelito.rs:892"]
violates = ["cancel_safe = true", "theSix.toml:249"]
summary = """
`set()` ran prepare -> await tier.set() -> commit/abort with no guard object
anywhere in the sequence. `PopulationGuard` solves exactly this problem for
`get_or_fetch` and was constructed only in that path — the write path never
instantiated it.
"""
mechanism = """
prepare()                        entry.state = Prepared
                                 population_owner = true
                                 intent_present = true
  await tier.set(...)            caller is cancelled here
future dropped                   no Drop impl runs
  -> nothing aborts the intent

The entry stays Prepared with an owner no one will ever satisfy. It is not
readable (correct) but it is not claimable either, so every subsequent operation
on that key waits out the full bound and fails. The intent survives only until a
recovery sweep older than INTENT_RECOVERY_AGE clears it.
"""
why_this_is_not_a_test_gap = """
The mechanism required to fix it is already written and already proven in this
crate — `PopulationGuard`'s Drop releases the claim. The implementation simply
does not apply it to the write path. This is an omission, not a design gap.
"""
resolution = """
`IntentGuard` in src/manager.rs. Shape mirrors `PopulationGuard` — it holds the
token and an `armed` flag — with one addition: `abort(&mut self, error)` is a
single method rather than `disarm()` followed by `abort(token())`. An earlier
version removed the token from an `Option` on disarm, so that ordering panicked;
the cancellation test is what caught it. Keeping the token and tracking liveness
separately makes the mistake unrepresentable.

Held across the await in both `set()` and `move_entry()`.
"""
tests_added = [
  "tests/recovery: a_cancelled_set_releases_its_commit_intent",
  "tests/recovery: a_cancelled_write_does_not_wedge_the_population_path",
]
anti_vacuity_note = """
Both tests assert the stall actually fired before asserting the abort — the first
via `HangingTier::reached() > 0`, the second via `ledger.fired(FaultClass::Latency)`.
The second uses a one-shot latency fault rather than a permanently hanging tier,
because with a permanently hanging rung the follow-up call times out on the data
plane either way and a duration assertion would prove nothing about the claim.
Both were confirmed to fail against the pre-fix code with the guard's Drop neutered.
"""

[[bug]]
id = "B2"
title = "A failed tier.set can leave data-plane residue the abort does not remove"
severity = "blocking"
status = "resolved"
resolved_at = "2026-10-04"
accepted_by = "leo"
rationale = """
Fixed by compensating removal on `CacheError::WriteIndeterminate`, plus the error
variant that makes the condition expressible. Also added `FaultClass::PartialWrite`,
the only fault that stores bytes and then fails, so the property finally has a test
that can fail.
"""
verified = true
blocks_merge = true
locations = ["src/manager.rs:815", "src/manager.rs:843", "src/manager.rs:851"]
violates = ["partial_commit_visible = false", "theSix.toml:54"]
note_on_second_clause = """
`cancelled_operation_may_commit_partially` is no longer listed as violated. B1's
`IntentGuard` made cancellation resolve the intent, and residue from a cancelled
write is indistinguishable from residue from a failed one — both are handled by the
same indeterminate-write path. The clause is better read as a property of the
recovery mechanism than of the error class, and it is now covered by the recovery
layer rather than contradicted here.
"""
summary = """
The commit-failure path correctly removes the residue it created; the
tier.set-error path does not. The asymmetry is the bug.
"""
mechanism = """
tier.set() succeeds, commit() fails  -> tier.remove() THEN abort()   (clean)
tier.set() returns Err after writing   -> abort() only              (residue)

Concretely, at src/manager.rs:815 the commit-failure arm calls
`tier.remove(&key_ref)` before aborting, with the comment "Uncommitted: the
destination copy is residue." The tier.set-error arms at :843 and :851 call
`abort` and nothing else. So a backend that writes bytes and then reports an
error leaves the control plane saying "aborted" and the tier holding a value the
control plane has no record of.
"""
why_this_is_not_a_test_gap = """
It is a test gap AND an implementation gap, and they compound. The existing
`partial_write` test exercises the control-plane intent only; it never has a
backend write bytes and then fail. So the property the contract states is not
merely unimplemented, it is untested.
"""
resolution = """
Added `CacheError::WriteIndeterminate` and removed the key from the rung when a
write reports it. The discriminator is the error, not a tier capability flag — the
first attempt used `CapabilityFlags::ATOMIC_WRITE_OR_ERROR` and was wrong, which
the pre-existing `write_failure_fails_a_write_and_leaves_the_old_value` test caught
immediately. A blanket per-tier claim cannot distinguish a rejected write from an
accepted one: `WriteFailure` and `PartialWrite` share a tier and produce opposite
requirements, so the flag over-removed and destroyed committed values. Only the
tier knows what happened, so the tier has to say so, per operation.

`ATOMIC_WRITE_OR_ERROR` is retained as reported capability — true of every in-tree
backend, and useful to a consumer choosing a rung — but it does not govern cleanup,
and its doc comment says so.

Where the harm actually occurs is narrower than first assumed, and the tests record
it: on a *fresh* key the residue is invisible either way, because reads consult the
control plane first and an aborted entry reads as `Absent`. The damage requires a
previously-committed value, where the rung silently becomes the new bytes while the
control plane still describes the old one.
"""
tests_added = [
  "tests/fault_injection: the_partial_write_fault_really_stores_bytes_before_failing",
  "tests/fault_injection: a_failed_write_does_not_silently_replace_a_committed_value",
  "tests/fault_injection: a_definite_write_failure_leaves_the_committed_value_alone",
]
verification_note = """
Only `a_failed_write_does_not_silently_replace_a_committed_value` fails against the
pre-fix code — it is the regression test. The first proves the fault is real and is
routed through the tier directly, because the manager's job is to delete the residue
and a manager-level fixture assertion would assert its absence. The third guards
against over-correction and passes either way by design.
"""
review_addendum = """
The review's framing is correct and slightly stronger than stated: this is not
only a residue problem. Because `abort` restores the previously committed state,
a residue left behind can also be *served* to a later reader if the entry is
re-populated at the same rung — the abort makes the slot claimable again while
the stale bytes are still on the rung.
"""

[[bug]]
id = "B3"
title = "Move recovery is declared complete-forward but cannot be completed after a crash"
severity = "blocking"
status = "resolved"
resolved_at = "2026-10-04"
accepted_by = "leo"
rationale = """
Resolved by redefining the contract, not by implementing the recovery.
`recovery_direction_prepare_move` is now `external-reconciliation`, which is what
the runtime can actually do. Accepted as a deliberate, documented limitation rather
than a defect: the alternative was persisting enough identity to reconstruct a
move, which is a feature and not a fix.

Also made the limitation structural rather than prose: `RecoveryDirection::
for_kind(Move)` now returns `ExternalReconciliation`, `Cachelito::resolve_intent`
declines it, and `RecoveryReport` counts these separately from `failed` so a caller
can tell "the sweep could not do this" from "the sweep lacks the information".
"""
verified = true
blocks_merge = true
locations = ["src/manager.rs:386", "src/manager.rs:411", "src/control/cachelito.rs:106"]
violates = ["recovery_direction_prepare_move", "theSix.toml:64"]
summary = """
`RecoveryDirection::for_kind(IntentKind::Move)` correctly returns
CompleteForward, and `Cachelito::resolve_intent` can complete a move when handed
a key. The production path can never hand it one.
"""
mechanism = """
Cachelito persists only `key_hash: u64` (src/control/cachelito.rs:106). Completing
a move needs the actual key bytes plus source and destination rungs: read source,
write destination, remove source, commit. After a crash the key bytes are gone,
so recover_older_than counts the intent as failed at src/manager.rs:411
(`IntentKind::Move => failed += 1`) and moves on.
"""
the_trap = """
A recovery algorithm that works in isolation, with no recovery path capable of
invoking it after the failure it was designed for. `partial_promotion` passes
because it drives resolve_intent directly with a key in hand, which is exactly
why the suite is green and the behaviour is still absent.
"""
status_of_the_knowing = """
Partially disclosed. `living.toml`'s pending_work and AGENTS.md both state that
move recovery reports failed and needs an external reconciliation source. The
defect is that `theSix.toml` still promises complete-forward, so the machine-
checked contract and the runtime disagree. The disclosure in prose does not
satisfy a machine-checked clause.
"""
resolution = """
Option (b) was chosen. `theSix.toml` now declares
`recovery_direction_prepare_move = "external-reconciliation"`, with a comment
recording why neither complete-forward nor abort is available.

Three structural changes so the limitation cannot drift back into a promise:

* `RecoveryDirection::for_kind(Move)` returns `ExternalReconciliation`, not
  `CompleteForward`. A sweep holding only a hash has no direction it can execute,
  and the type now says so.
* `Cachelito::resolve_intent` declines `ExternalReconciliation` with an error.
  Committing the control-plane half of a move whose data half never happened would
  publish a move that did not occur.
* `recover()` returns `RecoveryReport { recovered, failed, needs_reconciliation }`
  instead of a two-tuple, because "the sweep tried and lost" and "the sweep has no
  information" need different responses and were sharing a counter.
"""
tests_added = [
  "tests/continuity (unit): only_abort_is_executable_without_the_key",
  "tests/recovery: an_unresolvable_move_is_reported_separately_from_a_failure",
  "tests/contract: declared_recovery_directions_match_what_the_runtime_can_execute",
]
anti_vacuity_note = """
The contract test asserts the declared string against `RecoveryDirection::for_kind`
and was confirmed to fail when the clause was set back to `complete-forward`. That
is the only test in the suite that compares a declared invariant to runtime
behaviour rather than to the runner and the test inventory, and its absence is
precisely why this defect survived review.
"""
deliberately_not_done = """
Option (a) — persisting the key bytes, or a durable handle to them, in
`CommitIntent` — would let recovery actually finish a move. Not attempted: it
changes the control plane's payload-free guarantee, which is a contract invariant
in its own right. `CommitIntent` holding key bytes is exactly the kind of thing
`commit_protocol` exists to forbid.

A related limitation, also left in place: a move removes the source rung *before*
it commits, so a crash in that window leaves the value only at the destination. Any
future reconciliation pass must account for that window rather than assuming the
source is still authoritative.
"""

