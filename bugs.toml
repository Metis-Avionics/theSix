# file cannot be mistaken for a passing state: the clauses in `theSix.toml` that
# findings B1, B2 and B3 contradict are asserted by `tests/contract` today, and
# those assertions are true *about the contract text*, not about the runtime.
#
# Each finding below was re-derived from the source at the recorded commit before
# being written down. The review's own claims were not taken on trust; where the
# review was right, the confirming line is cited. Where the review overstated
# something, that is recorded too.

