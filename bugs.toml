summary = """The gate named `unit` had argv

    cargo nextest run ... --test integration --test hierarchy --test policy --test stampede

`--test X` selects an integration-test binary and excludes the lib binary, so the 49
`#[cfg(test)]` tests inside `src/` were compiled by `check` and `clippy` (both use
`--all-targets`) and never run. testkit's 4 were in the same position. Nothing
reported it, because the tests pass -- only a failure would have been visible, and
