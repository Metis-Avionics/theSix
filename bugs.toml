[[bug]]
id = "B17"
title = "Nothing evicted, so a cache whose whole ladder is full refused new writes"
severity = "should-fix"
status = "resolved"
blocks_merge = false
verified = true
locations = [
  "src/manager.rs:set",
  "src/control/cachelito.rs:reserve_eviction",
  "src/tier/trait.rs",
  "src/tier/fixed_tier_stub.rs",
]
violates = ["concurrency.testing.promotion_eviction_races"]
source = "independent review of both PRs at 5ab1aaa; scope re-derived during the 0.4.0 backlog pass"
relates_to = "B16"
summary = """
`FixedTierStub::set` returns `CapacityExhausted` when its slot table is full, and
`set` degrades down the ladder on that error. The walk reaches L1 and then L0,
and when both are full there is nothing left to degrade to, so the write was
refused. Measured on `main` at `e46a041`: 1_024 keys accepted at L1, 953 at L0,
then `CapacityExhausted` on write 1_977 -- and never again.

`find_empty` already reclaimed empty, self-owned and *expired* slots, so the
real gap was narrower than the finding implied: only a full table of live
non-expiring entries could never be reclaimed.
"""
fix = """
Eviction, in three parts so the data plane never decides anything:

* `CacheTier` gains `eviction_candidate()` and `remove_if_address()`, both
  defaulted pessimistically (`None` / `Ok(false)`) in the spirit of
  `capability()`. A tier nominates; it does not authorise.
* `Cachelito::reserve_eviction(address)` is the authority. Under the shard lock
  it admits only an entry that is `Ready`, unowned and intent-free, and it
  advances the generation *before* returning, so a commit holding a token for the
  old generation is refused rather than landing in a slot about to be reused.
* `set` calls eviction only once the ladder walk is exhausted, coldest bound rung
  first, and re-walks. It is a last resort, not the first move: degrading
  preserves a hotter rung's contents, whereas evicting at the first full rung
  destroys them.

Evicting from the data plane alone would have been unsafe, and the reason is
worth recording because it shaped the whole design: an eviction that did not
touch the control plane would leave the generation untouched, so a writer
between `prepare` and `commit` would still commit successfully -- into a slot
now holding a different key's value. That is silent stale data, the same family
as B2/B6/B19.
"""
verification = """
`eviction_reclaims_a_saturated_ladder` is a declared negative case in
`theSix.toml` and `NEGATIVE_CASES`, proven in the negative layer: 4_000 writes
are all accepted where `main` refused at 1_977, and every read is checked to
return either the correct value or a miss -- never a wrong one.

Two authorisation tests in the concurrency layer prove the safety properties:
an entry with an outstanding commit intent is not evictable, and a settled
`Ready` entry is. `removing_by_a_stale_address_refuses_and_keeps_the_value`
covers the address-conditional removal.

The conditional removal was mutation-checked: made unconditional, it fails with
"a foreign address must never remove a resident slot" (`left: true,
right: false`). The generation bump is defence in depth and is *not* covered by
that mutation -- the eligibility refusal is what closes the tested window -- so
it is recorded as belt-and-braces rather than claimed as load-bearing.

Two soak assertions changed, and deliberately so. `the_default_ladder_survives_a_key_flood`
previously required every accepted value to still be readable, which was true
only *because* a full ladder refused writes. It now requires the narrower and
stronger property: a read returns the correct value or a miss, never a different
value. 1_031 of 3_000 reads report a miss (evicted) and none report a wrong
value. `the_manager_degrades_down_the_ladder_before_it_fails` was left untouched
and still passes, which is the check that eviction did not quietly become the
first move.

Three mistakes during this work are worth recording because each was caught by a
test rather than by reading:

* evicting hottest-rung-first, which kept L1 accepting every write and meant the
  ladder never degraded -- caught by the untouched degradation test;
* gating eviction to `pass == 0`, which allowed exactly one eviction per process
  and then refused again -- caught by the flood test still stopping at 1_964;
* several edits that silently failed to apply, producing false readings. Every
  later edit asserts its anchor.
"""
rationale = """
Fixed rather than waived. "A cache that eventually stops accepting writes" is a
defect in the thing the crate exists to be, and the safe version needed the
control plane involved, which is now how it works.
"""

