[[bug]]
id = "B6"
title = "abort restores Ready over a rung of unknown contents, so an uncommitted write becomes readable"
severity = "blocking"
status = "resolved"
resolved_at = "105bf05"
accepted_by = "user"
verified = true
blocks_merge = true
locations = ["src/control/cachelito.rs:abort", "src/control/cachelito.rs:abort_intent_by_address", "src/manager.rs:IntentGuard"]
violates = ["partial_commit_visible = false", "no_silent_data_loss = true"]
source = "second external review of PR3, at 105bf05"
summary = """
The live `WriteIndeterminate` path B2 fixed left the recovery and cancellation
paths with the same defect. On an already-populated key:

    Ready("old") -> Prepared -> tier.set("new") -> cancel -> IntentGuard::drop
                 -> abort -> Ready

The rung holds "new" and the control plane says `Ready`, so the next read serves a
value nobody authorised. The old justification — "the read path consults the
control plane first, so residue is unreachable" — held only while the entry stayed
`Prepared`, and restoring `Ready` is exactly what ended `Prepared`. The same window
existed on the recovery sweep, which has no tier handle and so cannot remove
residue even in principle.
"""
wider_than_reported = """
Two things the review did not have. First, `abort`'s own doc comment claimed it
"advance[d] the generation to invalidate anything that did land" while an inline
comment twelve lines below said the generation was deliberately not advanced. The
function did not do what its documentation said, in either direction.

Second, the root cause is that `CacheError` is asymmetric. B2 added
`WriteIndeterminate` for "my bytes may have landed" and no converse, so no other
error may be read as "they definitely did not" — including `TierUnavailable` and
`Timeout`, which are both compatible with a write that landed. `CacheError` has no
variant that means "provably stored nothing", which is why the control plane
cannot classify and must assume the worst.
"""
rationale = """
`abort` is now conservative by default: it sets `Failed` (the one state the read
path will not serve) and advances the generation, instead of restoring
`intent_prev_state`. `abort_intent_by_address` does the same, since a sweep has no
tier handle.

The restoring behaviour is preserved where it is sound, as
`abort_proven_clean`, used only for `SerializationFailed` and `CapacityExhausted`
— the two errors decided before any bytes are sent. This is a separate method
rather than a `bool` argument because the caller is what knows which errors carry
the guarantee, and a boolean eventually gets passed `true` by someone who had not
proved it.

Reviewer's option 3 (versioned writes validated on read) was not taken:
`CacheTier::get` returns bare `V`, so it would mean changing the trait across every
tier and backend. The cost of the chosen fix is one extra repopulation, not data
loss — the rung still holds whatever is there and repopulation reads it back.
"""
required_test = """
Cancellation after a write has landed, and recovery sweeping such an intent, must
both leave the entry unservable. A tier that fails cleanly proves nothing here: it
stores no residue. The test needs a tier that writes and *then* reports a failure
nobody can classify.
"""
test_note = """
`testkit::MisreportingTier` was added for this and is deliberately not a
`FaultClass`: every fault class is contract-named, and the contract already has an
honest answer (`WriteIndeterminate`, which `FaultyTier` reports via
`PartialWrite`). What the contract has no name for is a backend that returns a
clean-looking error *after* storing. Asserting against a well-behaved tier would
have proved nothing about residue, which is how this gap survived.

Three tests changed because their premise was unsupported rather than because
behaviour regressed. `a_prepared_write_aborts_and_keeps_the_committed_value`
asserted the bug: it required abort to restore `Ready`. Two fault-injection tests
asserted that an old value stays *readable* after `TierUnavailable`, which is only
sound for a provably-rejected write. Each was rewritten to assert what actually
holds — the uncommitted value is never readable, no intent leaks, the key is not
wedged — and the provably-clean case is now covered explicitly via
`CapacityExhaustion`. All three failed against the old behaviour.
"""

