installs nightly with `llvm-tools-preview`, which is what cargo-fuzz needs, so
compiling it from source adds no new prerequisite. `--locked` because an unlocked
`cargo install` resolving different transitive versions on a nightly compiler is
how an advisory job starts failing for reasons unrelated to the code under test.
"""
rationale = """
The general defect is a build step that reports success having done nothing. This
workflow had two of them -- B11's missing sccache and this -- and both were
invisible locally because both only fail where the tool is absent. The honest
summary is that CI executing for the first time found three separate things that
had never run, which is an argument for the unfiltered `pull_request` trigger and
against every claim in this repository that the gates were already covering it.
"""

# ---------------------------------------------------------------------------
# OPEN, NON-BLOCKING — REMAINING WORK
# ---------------------------------------------------------------------------
#
# B15–B20 come from an independent review of both PRs at the current heads, which
# returned MERGEABLE for each with no blocking finding. The six items below are
# that review's "remaining engineering debt", recorded here so they are tracked by
# a gate rather than living only in prose.
#
# None of them blocks a merge, and the mechanics are deliberate rather than
# accidental: `merge_readiness` inspects `status` only for entries with
# `blocks_merge = true`, so an open non-blocking finding is counted by the check
# and does not fail it. That is the behaviour wanted here — the work is real and
# should not be forgotten, and it is also genuinely not a reason to hold a branch
# whose blocking findings are all cleared.
#
# `status = "open"` is therefore accurate, not a euphemism. If any of these is
# promoted to `blocks_merge = true` before it is fixed, the gate goes red
# immediately, which is the intended pressure.

[[bug]]
id = "B15"
title = "A swept Move intent wedged its key's population path permanently"
severity = "should-fix"
status = "resolved"
blocks_merge = false
verified = true
locations = [
  "src/manager.rs:recover_older_than",
  "src/control/cachelito.rs:release_population_claim",
  "src/continuity.rs:RecoveryReport",
]
violates = []
source = "independent review of both PRs at 5ab1aaa; confirmed against source during the 0.4.0 backlog pass"
relates_to = "B3"
summary = """
B3 made the direction honest -- a `Move` maps to `ExternalReconciliation`, not
`complete-forward` -- and left a capability gap with a permanent cost. The sweep
counted a move in `needs_reconciliation` and left the entry `Prepared` with
`population_owner = true`. Both `acquire` and the write path decline a `Prepared`
entry that holds an owner, so nothing could ever write or populate that key
again; only an external reconciler holding the key bytes could clear it, and one
that never arrived left the key wedged for the life of the process.
"""
fix = """
The claim is now released while the intent is deliberately **kept**.

`Cachelito::release_population_claim(address)` marks the entry `Failed`, advances
the generation and drops the population owner, without clearing the intent.

Two decisions inside that, both load-bearing:

* `Failed` rather than the restored pre-intent state. Restoring would point the
  control plane at a source rung the interrupted move had already emptied, and a
  read would serve that emptiness as though it were the value -- turning a
  visible wedge into silent wrong data. `Failed` points nowhere: reads miss, and
  a later write supersedes whatever the move left behind. It is sufficient to
  unblock the key because `acquire` already accepts `Absent | Failed | Stale`.
* The intent is retained rather than cleared. Clearing it, as
  `abort_intent_by_address` does, destroys the only record that a move was in
  flight, and the control plane keeps only a key hash -- so the report could say
  "one move needs reconciliation" without saying which key. Retaining it costs
  nothing operationally because `prepare` overwrites an existing intent rather
  than refusing, so the key stays writable and the evidence survives until the
  key is next written.

`RecoveryReport` gains `released_for_reconciliation`, kept separate from both
`recovered` (nothing was recovered) and `needs_reconciliation` (that is the
obligation, this is the remedy taken for the wedge). Folding them together would
make a stuck key look like ordinary contention, which is the confusion this
finding was filed against.
"""
