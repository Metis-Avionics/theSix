[[bug]]
id = "B19"
title = "A read overlapping an abort was handed a value the control plane had stopped describing"
severity = "blocking"
status = "resolved"
blocks_merge = true
verified = true
locations = [
  "src/manager.rs:719",
  "src/control/cachelito.rs:808",
  "src/tier/trait.rs:165",
]
violates = ["cia.integrity.silent_stale_data_acceptance"]
source = "settled by the test this finding asked for; the answer was the second of the two outcomes it named"
relates_to = "B6"
summary = """
This was the tracker's only `verified = false` entry, on the deliberate grounds
that nobody had forced the interleaving, so the concern was unproven in *either*
direction. It is now proven, and proven in the direction that promotes it.

`get` peeks, and on `Ready` awaits the tier. That is the one window in `get`
with no guard across it. An `abort` landing during the await leaves the entry
`Failed` with the generation advanced, while the rung still holds the residue of
the abandoned write -- and the caller received that value regardless.

Settled with `a_read_that_overlaps_an_abort_reports_what_the_control_plane_now_says`,
which parks the read inside the tier with `GateTier` so the abort is placed
deterministically rather than hoped for. Against the unfixed code it reports:

    B19 CONFIRMED as a defect: the caller received "seeded" while the control
    plane describes the entry as Failed at generation 1 (was Ready at 0)

which is the second outcome `what_would_settle_it` described, and that entry
instructed promotion to `blocks_merge = true` immediately.
"""
fix = """
`get` now revalidates after the tier read: if the settled entry is no longer
`Ready`, the value is discarded and `Miss` is reported, matching the existing
`InFlight` arm's treatment of a settled non-`Ready` entry.

Only the *state* is rechecked, not the generation. A benign concurrent commit
does not disown an entry -- the value is still one this cache committed -- while
`Failed` means the value is residue of an abandoned intent and must not be
served. Checking state keeps the read path's cost to one extra control-plane
observation rather than turning every generation bump into a miss.
"""
verification = """
Mutation-checked: with the revalidation removed the test fails with the
CONFIRMED message; with it in place all 7 concurrency tests pass. 23/23
mandatory gates green, `performance` and `soak` unaffected by the extra
observation.
"""
rationale = """
Promoted and fixed rather than closed. This was reachable in ordinary operation
-- a `get_or_fetch` that fails mid-flight, concurrent with a `get` already parked
on the rung -- and it served residue of an abandoned intent, which is the same
family as B2 and B6. The finding's own text said so.
"""

[[bug]]
id = "B20"
title = "The proof registries prove a test is named and exists, not that it exercises the clause"
severity = "should-fix"
status = "resolved"
blocks_merge = false
verified = true
locations = [
  "testkit/src/coverage.rs:missing_locators",
  "testkit/src/coverage.rs:declares_clause",
  "testkit/src/lib.rs:proves",
  "tests/contract/invariant.rs",
]
violates = []
source = "independent review of both PRs at 5ab1aaa; stated by this repository's own documentation"
relates_to = "B9, B16"
summary = """
Three registries bind declared names to proving tests: `INVARIANT_PROOFS` (94
rows), `PROPERTY_CASE_PROOFS` (9) and `FAULT_CASE_PROOFS` (12). `missing_locators`
resolved each `path::fn` and checked a function of that name was defined in that
file. It did not check that the function was a test, and it did not check that the
test exercised the clause it was cited for. A row pointing at a real but
irrelevant function satisfied the gate.
"""
what_is_and_is_not_closed = """
Closed by the required fix: a locator that resolves but does not declare the clause
now fails, so citing the wrong test cannot pass quietly.

Closed earlier: a declared clause cannot exist without something responsible for
it, and a test cannot be renamed out of a citation. The locator match is
word-bounded after mutation testing showed the substring form let
`no_authority_inversion_RENAMED` satisfy a claim on `no_authority_inversion`.
"""
required_fix = """
Per-row fault-ledger assertion, which is the instrument the fault layer already
uses: each row asserts that the thing it injects actually happened, so a citation
to an irrelevant test fails rather than passing quietly. A stricter string match
cannot close this and should not be mistaken for progress toward closing it.
"""
fix = """
The label moved into the test. Every proving test now declares what it proves:

    testkit::proves!("clause.a", "clause.b");

which expands to a `const _` binding, so it is real code the compiler checks
rather than a comment a reader has to trust. The gate then requires the cited
function's *own* declaration to contain the cited clause. A mis-citation fails,
because the wrongly cited test's list does not contain that clause -- the registry
says which test it expects, the test says what it proves, and the two must agree.

75 functions annotated across all three registries, mechanically from the registry
itself so no row could be skipped by hand.

The span is delimited by line rather than by matching braces. A brace scanner has
to understand char literals, lifetimes, raw and byte strings, and braces in
comments; a first attempt failed on exactly that and reported a body it could not
close for a function that closes perfectly well.
"""
verification = """
Four mutations, each of which a substring implementation would have passed:

* M1 -- repoint a row at a real, unrelated test: caught.
* M2 -- repoint it at a different test in the same file that discusses the same
  behaviour: caught, because the span is per-function.
* M3 -- replace the declaration with a comment naming the clause. **This one was
  not caught at first.** `// proves!("clause")` contains the same bytes as the
  declaration, so the substring check passed with the declaration commented out.
  `declares_clause` is now anchored to the start of a trimmed line, and skips
  comment lines inside the argument list.
* M4 -- rename one clause inside a multi-clause declaration: caught, because
  literals are compared whole, so `a.b` cannot match a declared `a.b.c`.

Two implementation faults were found by the gate itself rather than by reading:

* `enumerate()` supplies an item index, not a byte offset. Used as one it truncated
  every span to sixteen characters, so all 115 rows looked undeclared and the
  failure looked like a missing-annotation problem. The Python model of the same
  logic tracked bytes and passed, which is what identified the discrepancy.
* After that fix, 38 rows still failed because `cargo fmt` wraps the `proves!`
  call when a test proves several clauses, and the single-line parser read an empty
  argument list. Not a data problem: a formatting interaction.

A `git checkout` of `tests/integration.rs` during M3 also wiped that file's
annotations, which the re-annotation pass had to restore. Worth recording because
the restored state was verified by re-running the gate rather than assumed.
"""
rationale = """
Fixed, because the required fix is available in the same shape as an instrument
the crate already trusts. What remains irreducible is a test that asserts the wrong
thing while declaring the right clause: a declaration is a claim by the test about
itself, so it can be wrong in the same way any test can be wrong. That is what the
mutations above bound -- not truth, but the ability of a reviewer to catch a false
claim mechanically rather than by reading 76 tests.
"""

