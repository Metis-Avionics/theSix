source = "second external review of PR3, at 105bf05"
summary = """
The fuzz job's `run:` block ended with an `echo "::endgroup::"` and a `done` after
the closing `fi` of an `if`. GitHub runs a multiline `run:` as one shell script, so
the block is a syntax error: the step fails before the loop executes. The job is
`continue-on-error: true`, so the failure was reported as an allowed advisory
failure rather than a red job — meaning every fuzz target the job claims to
smoke-run has never actually been run in CI.
"""
why_it_matters_here = """
A branch whose stated purpose is making verification incapable of lying shipped a
verification step that could not run, hidden behind the one mechanism designed to
hide failures. The local `fuzz` gate only builds the targets; the smoke loop is
CI-only, so no local gate could have caught it.
"""
rationale = """
Removed the stray `echo`/`done`. All 22 `run:` blocks in the workflow were then
parsed with `bash -n` and are valid.

Not converted into a permanent gate, which is the real fix and is recorded as
follow-up: `xtask` would need a YAML dependency to extract the blocks, and
`xtask_unit` already runs its test suite, so a lint there would be picked up
without a contract change. Left undone rather than rushed.
"""
required_test = """
A check that every `run:` block parses. Not added — see resolution.
