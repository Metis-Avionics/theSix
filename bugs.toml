[[bug]]
id = "B4"
title = "The blanket IntegrityCheck digest is not 128-bit; its own comment claims it is"
severity = "should-fix"
status = "resolved"
resolved_at = "105bf05"
accepted_by = "user"
blocks_merge = false
locations = ["src/integrity.rs:98", "src/integrity.rs:104", "src/integrity.rs:56", "src/integrity.rs:131"]
violates = []
summary = """
`impl<T: Hash> IntegrityCheck for T` constructs two `DefaultHasher`s, hashes the
same value into each, and mixes the results. Both hashers see identical input
with identical construction, so `a == b` always, and the 128-bit result is a
deterministic transformation of one 64-bit hash rather than 128 bits of entropy.
The comment on line 93 says "Two independent hashers" and that is false.
"""
three_semantics_in_one_module = """
  ContentDigest::of_bytes   two FNV seeds          genuinely 128-bit   (:56)
  KeyFingerprint::of        two FNV seeds          genuinely 128-bit   (:131)
  IntegrityCheck blanket    two DefaultHashers     effectively 64-bit  (:98)
"""
impact = """
Not a vulnerability: the digest never leaves the process, so this is corruption
detection and not tamper resistance, which the module already documents. But the
collision model differs by a factor of 2^64 depending on which constructor a
caller happened to use, and the code claims a uniformity it does not have.
"""
required_fix = """
Either seed the two hashers differently so they are genuinely independent, or
reduce the blanket impl to an honestly-named 64-bit digest and document the
weaker collision bound. The second option is defensible for in-process use.
"""
required_test = """
A digest test that asserts two distinct values produce distinct digests is not
sufficient — it passes today. Assert the *stated* entropy instead, or drop the
128-bit claim from the doc comment so nothing depends on it.
"""
rationale = """
`SeededFnv`, a seeded FNV-1a `Hasher`, now backs the blanket impl, and the two
lanes are started from `FNV_OFFSET_A` and `FNV_OFFSET_B`. `DefaultHasher` cannot
be seeded, which is what made the honest construction impossible to express
before: two of them, built the same way and fed the same bytes, finished
identically. This also removes the `Self2` shim, which existed only to name the
return type.

The first candidate test was wrong in an instructive way. "The two lanes differ"
looks like it proves independence and does not: the broken impl stored
`high ^ high.rotate_left(32)`, which differs from `high` for every hash except
zero, so that assertion passed against code carrying 64 bits of entropy. Two
derived quantities being numerically unequal says nothing about whether they were
computed independently. The test that actually discriminates
(`blanket_digest_is_two_seeded_fnv_lanes_over_the_hash_stream`) records the exact
byte stream a `Hash` impl emits and pins the digest to the documented
construction.

Both `blanket_digest_is_two_seeded_fnv_lanes_over_the_hash_stream` and
`blanket_digest_lanes_are_not_a_rotate_and_xor` were run against the old
construction and fail; the rest pass either way, which is why they are corpus and
lane-variety checks rather than the regression test.
"""

[[bug]]
id = "B5"
title = "Cachelito identifies control-plane entries by a bare 64-bit hash"
severity = "should-fix"
status = "resolved"
resolved_at = "105bf05"
accepted_by = "user"
blocks_merge = false
locations = ["src/control/cachelito.rs:106", "src/control/cachelito.rs:419", "src/control/cachelito.rs:504"]
violates = ["no_cross_key_corruption = true", "theSix.toml:341"]
summary = """
`ControlEntry` stores `key_hash: u64` and `find_slot` treats
`entry.key_hash() == key_hash` as identity (line 419). Two distinct keys with the
same 64-bit hash resolve to one control entry, so one key's generation, owner,
intent and tier would be applied to the other's key.
"""
the_inconsistency = """
This is the finding the reviewer puts best. `src/integrity.rs` goes out of its way
to separate placement identity from logical identity, and explains in a comment
that conflating them is why the previous stub aliased two keys onto one slot. The
data plane took that lesson — `KeyFingerprint` plus injectable `Placement`. The
control plane did not: it still collapses placement and identity into one 64-bit
value. The branch is philosophically inconsistent with itself.
"""
why_it_is_not_merely_theoretical = """
The data-plane stub has adversarial collision tests because `Placement` is
injectable and a collision can be produced on demand. Cachelito has no injection
point and no equivalent test, so `no_cross_key_corruption` is asserted for the
control plane but never demonstrated — the property is untestable there, not
merely untested.
"""
required_fix = """
Store a `KeyFingerprint` (128-bit) alongside the placement hash in
`ControlEntry`, and compare fingerprints for identity while using the hash only
to pick a start slot — mirroring the data plane's split. If a 64-bit placement
hash is to remain, make the placement strategy injectable so a collision can be
forced and the identity check demonstrated, as `Placement::AllToZero` already
does for the stub.
"""
required_test = """
Force two distinct keys onto one placement hash in Cachelito and assert they hold
independent state — separate generations, separate owners, separate intents.
"""
rationale = """
`KeyAddress` now bundles a 128-bit `KeyFingerprint` (identity) with a 64-bit
placement hash, bundled rather than passed separately so no call site can hold a
placement without the fingerprint that justifies it. `ControlEntry` and
`CommitToken` carry the address; `find_slot` compares fingerprints and uses the
placement only to pick the start slot, mirroring `FixedTierStub`.

`Cachelito` gained `with_placement`, sharing `integrity::Placement` with the data
plane. That is what converts the finding from "untestable" to testable, and it is
the part that matters: the property was previously asserted for the control plane
with no way to produce the adversarial case.

`a_placement_collision_does_not_alias_two_control_entries` and
`a_chosen_collision_pair_stays_distinct` were run against the old conflated
comparison and fail — committing one key resolved the other to `Ready`, and two
colliding keys produced one entry instead of two. That is B5 demonstrated rather
than asserted, which is what the finding asked for and could not previously get.
"""

