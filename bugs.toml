Removed the stray `echo`/`done`. All 22 `run:` blocks in the workflow were then
parsed with `bash -n` and are valid.

Not converted into a permanent gate, which is the real fix and is recorded as
follow-up: `xtask` would need a YAML dependency to extract the blocks, and
`xtask_unit` already runs its test suite, so a lint there would be picked up
without a contract change. Left undone rather than rushed.
"""
