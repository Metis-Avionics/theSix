summary = """
The fuzz job's `run:` block ended with an `echo "::endgroup::"` and a `done` after
the closing `fi` of an `if`. GitHub runs a multiline `run:` as one shell script, so
the block is a syntax error: the step fails before the loop executes. The job is
`continue-on-error: true`, so the failure was reported as an allowed advisory
failure rather than a red job — meaning every fuzz target the job claims to
smoke-run has never actually been run in CI.
"""
