# TETANUS -- NASA/JPL's *Power of Ten*, adapted to Rust, enforced as a ratchet.
#
# This file is the standard and the evidence that the crate was measured against
# it. `cargo xtask run tetanus` parses every `.rs` file under `scan_roots` and
# compares what it finds against `[[baseline]]` by exact set equality, in BOTH
# directions:
#
#   * a finding with no baseline entry fails  -> new violations cannot land
#   * an entry with no finding fails          -> a justification cannot outlive
#                                                the code it justified
#
# The second direction is what makes the first trustworthy. An analyzer that gets
# weaker produces *fewer* findings, which shows up as stale entries rather than as
# an improvement. That property is why the baseline exists instead of a lint.
#
# The rules are Gerard J. Holzmann's (NASA/JPL, IEEE Computer, June 2006). The
# Rust mapping below is this repository's own work and is not endorsed by JPL or
# by Holzmann. Nothing here should be read as a claim about their position on
# Rust, which they have not taken.

[meta]
standard = "The Power of Ten: Rules for Developing Safety Critical Code"
source = "Gerard J. Holzmann, NASA/JPL, IEEE Computer, June 2006, pp. 93-95"
note = """
The Rust mapping is ours. Three rules are adapted rather than transcribed, and the
adaptation is recorded per rule below rather than left implicit:

  * Rule 4 counts *statements*, not physical lines. `CacheManager::set` is about
    230 physical lines and roughly 98 code lines; the difference is comments
    documenting two race windows. A line count would demand a refactor the code
    does not need and would disagree with `clippy::too_many_lines`, which is live
    in this crate and skips comments.

  * Rules 5, 6 and 7 are about *interfaces*, not about code. This crate's central
    abstraction -- a consumer naming neither a rung nor a backend -- means the
    relevant evidence is a design invariant, not a syntax tree. Each rule below
    therefore has a clause the checker cannot decide, which is why they are
    `mixed` or `review` and name a `review_artifact`.

  * Rules 3 and 9 are unsatisfiable by construction. They are `reported`, not
    `gated`. See their `disposition` below.

The reported/gated split is the open question in this file, and the numbers are here
so it can be answered with data rather than with a preference. Rule 3 has 1033 sites
and rule 9 has 89. Neither is baselined: 1122 justifications repeating one sentence
would make the count the only thing anyone ever read, which is the failure mode a
baseline is supposed to prevent.

`.kilo/plans/1789334873419-tetanus-rule3-plan.md` argues rule 3 should instead be
*satisfied*, by breaking the public API to introduce a `MemoryPool<V>` slab allocator
and `KeyRef<'_>` keys so no `set`, `get` or `invalidate` allocates after init. That
is a real option and it is not this gate's to settle. Until it is settled, the honest
report is the number: rule 3 is not satisfied by this crate, in 1033 places, and rule
9 is not satisfied in 89.
"""

scan_roots = ["src", "xtask/src", "testkit/src", "tests", "benches"]

# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------

[[rule]]
id = 1
title = "no recursion: a called function must not call itself, directly or indirectly"
check = "mechanical"
disposition = "gated"

[[rule]]
id = 2
title = "no unbounded loop: every loop must have an exit reached on every iteration"
check = "mechanical"
disposition = "gated"

[[rule]]
id = 3
title = "no dynamic memory allocation after initialisation"
check = "review"
disposition = "reported"
review_artifact = "AGENTS.md, TETANUS section; and .kilo/plans/1789334873419-tetanus-rule3-plan.md for the case that it should be satisfied instead"

[[rule]]
id = 4
title = "at most 60 statements per function, comments excluded"
check = "mechanical"
disposition = "gated"

[[rule]]
id = 5
title = "no mixed validation: error and data must not share a validation path"
check = "mixed"
disposition = "gated"
review_artifact = "AGENTS.md, TETANUS section: the managed interface is the evidence, and no syntax tree can show it"

[[rule]]
id = 6
title = "restrict the use of static and global variables"
check = "review"
disposition = "gated"
review_artifact = "AGENTS.md, TETANUS section: the crate scopes state to a shard lock held across no await, which is a scoping claim a tree cannot verify"

[[rule]]
id = 7
title = "no check-then-act: a check must not be separated from the act it guards"
check = "mixed"
disposition = "gated"
review_artifact = "bugs.toml B19 and B22: the two races this clause is about are named, and their reproductions are the evidence a tree cannot supply"
# Required by `xtask run tetanus` and by tests/contract/tetanus.rs for any gated rule
# with no baseline entry. A gated rule that finds zero sites without saying why reads
# as a check that ran, rather than as a check with nothing to say.
#
# What this honestly records is a LIMITATION, not a clean bill of health.
finds_nothing_because = """
What is detected is narrower than the title. Rule 7 is titled `no check-then-act`,
which is a time-of-check-to-time-of-use rule: a check whose result is consumed by a
later statement acting on the same object. The implemented predicate cannot detect
that. Its entire input is the last statement of two branch blocks plus the syntactic
form of the `else`; it never reads the condition, never reads a `let` binding, and
never compares identifiers appearing in two places. Detecting TOCTOU needs
flow-sensitive reasoning about which operand the check read and which the later act
used, and this predicate has no notion of that.

What it detects instead is an `if` with an explicit `else`, where one branch's final
statement is `return`, `break` or `panic!` and the other branch's final statement is a
trailing expression with no semicolon. That is an early-return idiom, not a race.

The previous version of this field gave the zero a different cause. It said the crate
uses `?` for early exits and `let ... else { return }` rather than divergent
conditionals, so the shape does not occur here. Both claims are true and neither is the
reason. `?` parses as `syn::Expr::Try` and `let-else` as a `Stmt::Local`, so syn never
routes either to `visit_expr_if` at all -- the two idioms named as the explanation are
structurally invisible to this predicate whether or not this crate uses them. The zero
is a property of the analyzer, not a property of the house style.

Mutation testing confirms it from the other side. `let n = v.len(); if n > 0
{ v[n-1] } else { 0 }` is a real time-of-check-to-time-of-use violation of one buffer:
the length is read, then the index derived from that length is used, and nothing stops
the buffer shrinking in between. It produces no finding.
`rule_7_does_not_claim_to_detect_toctou` in xtask/src/tetanus.rs pins that shape as a
known miss, so if the predicate ever grows flow sensitivity this field has to be
rewritten rather than left describing a limitation that no longer applies.

The clause still earns its place as a ratchet in the form it actually has: it would
report `if c { return 1 } else { v[0] }` if either side grew an `else`, and it keeps
the early-return-plus-fallthrough shape from spreading. It does not discharge the rule
as titled. The two known real races in this crate are B19 and B22, each with a
reproduction, and those reproductions are the evidence a source tree cannot supply.
"""

# The title says TOCTOU and the predicate is not TOCTOU. Both spellings are declared
# so that neither is a surprise for a reader comparing `title` against the predicate
# in xtask/src/tetanus.rs: these two fields are where they find the difference, rather
# than a claim that the two agree.
as_titled = """
No check-then-act. A check whose result is consumed by a later statement acting on the
same object, with nothing preventing the object from changing in between.
"""
as_implemented = """
One `if` with an explicit `else`, where one branch's final statement diverges (`return`,
`break`, `panic!`) and the other branch's final statement is a trailing expression
without a semicolon. A conditional with no `else` is out of scope, and so is an
`else if` chain, which is one branch group rather than a branch.
"""

