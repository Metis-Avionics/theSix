id = 8
title = "no conditional compilation: all code must be compilable as written"
check = "mechanical"
disposition = "gated"

[[rule]]
id = 9
title = "no dynamic dispatch and no bare function pointers"
check = "review"
disposition = "reported"
review_artifact = "AGENTS.md, TETANUS section: Arc<dyn CacheTier> is the tier abstraction and Box<dyn Future> is what #[async_trait] emits"

