    "Invariant proofs live in testkit and invariant waivers live in theSix.toml. Duplicating the pairs into both files would recreate the self-graded-tracker defect one level down: the test side owns what its tests cover, the contract side owns what is admitted to be unverified, and tests/contract requires the union of the two to equal the declared set exactly",
    "`check` and `clippy` take --workspace. Both previously linted only the root package, so the gate runner and test harness were never covered, and four warnings had accumulated in xtask with no gate noticing. A gate that claims to cover the repository should ask the tool to cover the repository",
