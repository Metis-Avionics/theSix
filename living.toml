[changelog]
version = "0.4.0"
date = "2026-10-04"
entries = [
    { type = "added", description = "theSix.toml as the machine-checked source of truth; specs/*.toml deleted", scope = "theSix.toml" },
    { type = "added", description = "cargo xtask clap gate runner + justfile; gates are contract-declared", scope = "xtask/" },
    { type = "added", description = "Two-phase commit with a payload-free control-plane intent (prepare/commit/abort)", scope = "src/entry.rs, src/control/cachelito.rs" },
    { type = "added", description = "Capability semantics as three orthogonal axes; authority as a configured role", scope = "src/capability.rs" },
    { type = "added", description = "Integrity: ContentDigest over every value, 128-bit KeyFingerprint with injectable Placement", scope = "src/integrity.rs" },
    { type = "added", description = "Deterministic fault injection: 12 fault classes, seedable plan, recording ledger", scope = "src/fault.rs, testkit/" },
    { type = "added", description = "Tenant-framed keys with an explicit separator; oversized frames rejected not truncated", scope = "src/key.rs" },
    { type = "added", description = "Structured telemetry: 11-field OperationRecord, no payload, non-reversible KeyIdentity", scope = "src/telemetry.rs" },
    { type = "added", description = "Continuity states, RecoveryDirection, RecoveryReport; manager continuity() and recover()", scope = "src/continuity.rs" },
    { type = "added", description = "Ten new test layers: contract, negative, property, fault_injection, recovery, durability, security, performance, soak, loom", scope = "tests/" },
    { type = "added", description = "Nine fuzz targets in an excluded crate; built by a gate, run by an advisory CI job", scope = "fuzz/" },
    { type = "added", description = "merge_readiness gate driven by bugs.toml; expected counts held in theSix.toml", scope = "xtask/src/gates.rs, bugs.toml" },
    { type = "added", description = "xtask_unit gate: the runner that decides what passes is itself under test", scope = "xtask/src/gates.rs" },
    { type = "added", description = "FaultClass::PartialWrite - the only fault that stores bytes then fails", scope = "src/fault.rs" },
    { type = "added", description = "CacheError::WriteIndeterminate - per-operation signal that bytes may have landed", scope = "src/error.rs" },
    { type = "added", description = "IntentGuard: RAII release of a commit intent on cancellation", scope = "src/manager.rs" },
    { type = "added", description = "CapabilityFlags::ATOMIC_WRITE_OR_ERROR as reported capability (does not govern cleanup)", scope = "src/capability.rs" },
    { type = "changed", description = "BREAKING: tenant is part of the key, invalidating every existing cached key", scope = "src/key.rs, src/manager.rs" },
    { type = "changed", description = "BREAKING: rung substitution removed; bound_tier returns None, no panic on empty registry", scope = "src/manager.rs" },
    { type = "changed", description = "BREAKING: recover() returns RecoveryReport instead of a (usize, usize) tuple", scope = "src/manager.rs" },
    { type = "changed", description = "recovery_direction_prepare_move = external-reconciliation (was complete-forward)", scope = "theSix.toml" },
    { type = "changed", description = "BackendKind::is_native() replaced by is_implemented(); the old predicate returned true for five absent backends", scope = "src/tier/trait.rs" },
    { type = "changed", description = "Build profiles use debug = 0; debuginfo filled the disk mid-matrix", scope = "Cargo.toml" },
    { type = "added", description = "Every declared invariant is bound to a proving test or an explicit waiver. 94 proofs, 1 waiver, checked for exact set equality (was 89/6; the split moved in the 0.4.0 backlog pass) so an invariant cannot be declared without something responsible for it", scope = "testkit/src/coverage.rs, tests/contract/invariant.rs, theSix.toml" },
    { type = "added", description = "PROPERTY_CASE_PROOFS and FAULT_CASE_PROOFS bind each of the 9 declared property invariants and 12 declared faults to a path::fn that must exist. Both were previously checked as name lists for set equality, which proves two lists agree and not that a test exists; the property binding lived in two comments", scope = "testkit/src/coverage.rs, tests/contract/main.rs" },
    { type = "added", description = "missing_locators / unclaimed / overclaimed move the existence and coverage rules into testkit so one rule has one spelling; tests/contract/invariant.rs had its own copy of the locator walk", scope = "testkit/src/coverage.rs, tests/contract/invariant.rs" },
    { type = "added", description = "authorship gate: forbids attribution trailer KEYS across every commit message on every ref, reporting commit and subject without reprinting the trailer value. Unavailable (exit 3) on a shallow clone, so a depth-1 checkout cannot pass as a clean history", scope = "xtask/src/gates.rs, theSix.toml, .github/workflows/ci.yml" },
    { type = "fixed", description = "The authorship gate's git fixtures set only --author and inherited the committer from the host's global config, so 12 of 32 xtask tests failed on CI while passing locally; the helper also discarded stderr, so the failure said only 'git commit failed'", scope = "xtask/src/gates.rs" },
