[handover]
status = "published_0_3_0_and_0_4_0_pending_b21"
phase = "post_release"
last_updated = "2026-10-05T00:20:00+01:00"

summary = """
0.3.0 and 0.4.0 are published to crates.io, closing a gap that had been open since
0.2.3. The line is now monotonic on the registry: 0.2.0 through 0.2.3, then 0.3.0
(async tiers, L6 authority, capability reporting), then 0.4.0 (the contract
architecture, two-phase commit, and every finding below).

What 0.4.0 contains is the 0.4.0 backlog pass plus B23. Six findings closed, and
two of them were real defects rather than missing tests.

B15: a swept `Move` intent held a population claim on a `Prepared` entry, which
both `acquire` and the write path decline, so a key's population path was wedged
for the life of the process unless an external reconciler holding the key bytes
arrived. The claim is now released while the intent is deliberately kept --
`Failed` rather than the restored pre-intent state, because restoring would point
the control plane at a source rung the move had already emptied and a read would
serve that emptiness as a value.

B16: `cia.integrity.silent_stale_data_acceptance` was false, not unproven. `refresh`
returned a bare `Option<V>`, and the policy's fail-open mode let the population path
return another rung's value as a *successful* fetch -- stale bytes with a success
status claiming they were current. `refresh_detailed` reports `Freshness` and
`refresh` fails closed on the fetch.

B20: the registry documentation had admitted for two reviews that a resolved
locator proved nothing. Every proving test now declares its clause, and a
mis-citation fails the gate.

B23 is the one worth carrying forward. The proof obligation lived only in
`tests/contract/invariant.rs`, which the contract cannot read: `SEMANTIC_SECTIONS`
named seven sections, so 45 normative claims in `[verification]` and `[engineering]`
governed nothing. It is now declared as
`verification.every_invariant_has_a_proof_or_waiver` and proven by the audit that
enforces it -- nine sections, 140 leaves, 139 proofs, 1 waiver. Three
`engineering.design.*` claims moved outside the proof-bound set rather than being
given a proof that would assert their own wording.

Two compliance defects were found while reconciling documentation, neither covered
by any gate. `SECURITY.md` was GitHub's placeholder claiming support for 5.1.x,
5.0.x and 4.0.x -- versions that never existed; it reached `main` because a commit
was pushed straight to a feature branch and merged unchecked, which is B21's cost
made concrete. `CHANGELOG.md` claimed `main` was branch-protected and that the
registry only proved existence; both were true when written and false now.

0.3.0 was published from its own commit (`9a075b3`) rather than from a rebuilt
tree, because it is a genuinely different design: no two-phase commit at all, so
the findings that concern commit intents cannot apply to it. Its artifact carries a
stray tracked `test.txt` containing a copy of a CI workflow -- harmless, left in
place so the published bytes match an identified commit.

"""

pending_work = """
# Double entry with bugs.toml, kept deliberately. `pending_work` here holds the
# reasoning and the sequencing; `bugs.toml` holds the tracked status and is what
# `merge_readiness` reads. Each item below names its finding so the two can be
# reconciled by eye.
#
# B15 through B20 were listed here until this release and every one of them is now
# resolved. They were removed rather than marked done, because a pending list that
# accumulates closed items stops being a list of what is next. What remains is B21
# and the items that were never findings at all.

- **B21, and it is the only open finding. `main` has no required status check.**
  Branch protection's `required_status_checks` was switched off to merge PR2, which
  predates the contract and whose workflow emits no `Verification (all gates)` job;
  with `enforce_admins: true` there was no bypass. Every other rule is intact. The
  required check is `Verification (all gates)`, GitHub Actions app id 15368, with
  "Require branches to be up to date" enabled. It is recorded in `AGENTS.md`,
  `bugs.toml` B21 and here precisely because nothing enforces it: the finding is
  non-blocking, so the tracker counts it and does not fail on it. The automation
  token can delete the rule but every create/update path 404s, so it needs the web
  UI or a token holding Administration: write.
  This is now the only thing standing between the gate matrix and being enforced,
  and the cost is no longer hypothetical: an unreviewed commit reached `main` during
  the 0.4.0 backlog pass and put a factually wrong `SECURITY.md` on the registry's
  source of truth.

- **`concurrency.blocking_runtime_thread` needs a decision, not a test.** It is the
  one remaining waiver, and the waiver says why: `spawn_blocking` appears nowhere in
  `src/` and the contract has no clause requiring one, so the clause asserts a
  property of configured backends that the crate neither enforces nor can observe.
  Either narrow the clause to what the crate guarantees -- it introduces no blocking
  call on any path, which a source scan can prove -- and leave offloading to
  `BLOCKING_IO` as a backend declaration, or add a real offload path plus a blocking
  in-tree backend. Rewriting the clause to make the gate pass is the thing to avoid.

- **Durable backing for the authority rung.** L6 has no in-tree implementation, so
  the authority is a configured role with no binding, and `DurabilityClass::Verified`
  has no rung that earns it yet.

- **read_repair / reconciliation.** `ContinuityState::Reconciling` is representable
  and reported, but nothing drives it: there is no pass that compares a rung against
  the authority and repairs drift.

- **Atomic multi-key operations.** The commit protocol is per-entry. A caller wanting
  "these twenty keys or none" still has to coordinate outside the crate.

- **Streaming / non-ByteValue payloads.** Integrity framing covers the fixed tier stub
  via `IntegrityCheck` and the byte-oriented backends via an explicit frame, but a
  payload that cannot produce a digest has no integrity story.

- **Postgres/pgvector, Neo4j and HelixDB backends.** Each needs a live service to
  verify, and an unrunnable tier in a cache library is a liability. They follow once
  there is something to test against.

- **Housekeeping from this release.** The published 0.3.0 artifact contains a stray
  tracked `test.txt` holding a copy of a CI workflow. It is harmless and was left so
  the published bytes match commit `9a075b3`, but it should be deleted on `main`.

- **A standing rule, not work: do not cache or memoise a gate verdict.** A replayed
  verdict is the B5 defect one level up. The matrix is dominated by `loom` rather
  than by test execution, so there is no speedup to buy by weakening a check.

"""

remaining = [
