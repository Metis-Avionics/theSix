last_updated = "2026-10-04T18:00:00+01:00"

summary = """
0.4.0: the architecture is now a machine-checked contract, and the crate's own
tests found the defects that the contract's existence attracted.

theSix.toml is the source of truth. cargo xtask executes the gates it declares,
refuses to run a gate it does not declare, and exits 3 rather than 0 when a gate's
tooling is absent. tests/contract asserts the crate agrees with the contract - version,
rung count, fault taxonomy, negative cases, property invariants, and that every layer
is bound to a real test target. The six specs/*.toml files, which contradicted each
other and the code, are deleted.

Writing the contract down was the useful part. Each clause demanded a mechanism that
did not exist, and the gaps were found by the machinery built to close them:

Two-phase commit was the largest addition. set was three independently-failable steps
with no rollback, so a crash between the data write and the publish left a value in a
tier with no control-plane record. The control plane now carries a payload-free intent
record and the entry becomes Prepared - unreadable.

Recovery resolves by kind, and the two directions are not symmetric. A write aborts:
the value is reproducible, and the key hash is all a sweep needs. A move cannot be
completed by this crate at all. Finishing one means reading the source rung and
writing the destination, which needs key bytes, and the control plane persists only a
hash. Aborting is not the safe substitute either, because the move removes the source
before it commits - so a crash in that window leaves the value only at the
destination, and aborting would point the control plane at an empty source. The sweep
therefore reports such an intent as needing external reconciliation and leaves it
intact. That was a contract change, not a patch: theSix.toml used to declare
recovery_direction_prepare_move = "complete-forward", which described the correct
direction and one the runtime had no way to execute.

The negative and property layers found more than the contract asked about. They found
that a lost CAS in acquire reported the state the CAS expected, which looked claimable,
so the losing caller became a second population owner and single-flight admitted two
fetches for one key. A loom model found that abort overwrote a commit that had already
won, making a committed value invisible. A soak found that open addressing did not
survive deletion: find_slot stopped at the first empty slot, so removing a key orphaned
everything behind it, get returned None for values still stored, and the next write
leaked a pool index until the table ran out of capacity at two-thirds full.

Every one of those had a test that passed. That is the argument for the contract and
for the anti-vacuity instruments: test_tier_recovery called set_healthy(true), which was
already the default, so no failure was ever injected; test_waiter_timeout had no
waiters and an unreachable disjunct; seven tests could not fail. They have been
rewritten, and testkit's coverage registries are now compared for equality against the
contract, so a required case cannot be dropped without failing a gate.

Tenant is now part of the key. IdentityContext.tenant existed and no line of the crate
read it, so two tenants using the same application key shared one entry - a cross-
tenant read the authz gates could not prevent, because by the time they ran there was
nothing left to separate. This invalidates every existing cached key and is the one
upgrade hazard in this release; it is called out in the changelog and the README.

Authority is a configured role, and rung substitution is gone. tier(&L6) on a six-rung
manager used to return L0's data with nothing to indicate anything was wrong, and on an
empty rung list it panicked; a property test generated a manager with no rungs and
found the panic. bound_tier returns None instead, and nearest_bound_rung resolves the
policy's choice to the best bound rung at or below it - routing, not substitution.

An external review of this branch then found that the architecture was ahead of its
recovery semantics, and was right about all three blocking findings. Each one was a
promise theSix.toml made that the runtime did not keep:

- A cancelled set had no RAII guard on its commit intent, so a future dropped at any
  await in between left the key Prepared with an owner nobody would release. The
  symptom was narrower than first reported: set was never wedged, because prepare
  has no claimability precondition, and get was never wedged either. Only
  get_or_fetch was, since it must claim the entry to populate it - so the assertion
  a reviewer would naturally reach for would have passed against the broken code.
- A failed write left the rung holding a value the control plane had aborted. On a
  previously-populated key the rung silently became the new value while the control
  plane still described the old one: not an orphan, which is at least invisible, but
  a plausible-looking wrong answer.
- Move recovery, above.

The fix for the second one is the instructive part. The obvious design - gate the
cleanup on a new per-tier capability flag claiming write-or-error atomicity - is
wrong, and an existing test proved it immediately. A blanket per-tier claim cannot
distinguish a rejected write from an accepted one, so it removes the key in both
cases and destroys a good committed value in one of them. Only the tier knows
whether its bytes landed, so the tier has to say so per operation:
CacheError::WriteIndeterminate. The capability flag survives as reported capability,
documented as not governing the decision.

The same review noted that the contract gate only ever compared theSix.toml to the
runner and the test inventory, never to runtime behaviour - which is precisely why
all three findings survived a green gate run. tests/contract now asserts at least one
declared invariant against the runtime (the move recovery direction), and
cargo xtask run merge_readiness reads bugs.toml and fails while any blocks_merge
finding is open. The expected finding counts live in theSix.toml, not in the tracker:
a tracker that grades its own homework can be defused by editing itself, and the
tests written against that gate caught it passing on an emptied tracker and on a
self-consistent severity downgrade. xtask had no tests at all until this, so the
logic deciding which gates run was unverified; it now has its own gate.

Verification: twenty-five mandatory gates in ~2min on a warm cache, plus deferred
performance, soak and fuzz. nextest per-test processes, sccache, and clang + mold.
Build profiles moved to debug = 0 after debuginfo filled the disk mid-matrix and
produced nineteen failures that had nothing to do with the code.

A second review of the landed head then found that B2's fix had a recovery
cousin, and it was right about that too. `abort` restored the state the intent
interrupted, which on an already-populated key meant `Ready` over a rung whose
contents nobody had checked: a write that stored its bytes and then failed
became readable again. The justification in the code — the read path consults the
control plane first, so residue is unreachable — held only while the entry stayed
`Prepared`, and restoring `Ready` is what ended `Prepared`. `abort` now assumes
residue and leaves the entry unservable; the restoring behaviour survives as
`abort_proven_clean`, used only for the two errors decided before any bytes are
sent. The cost is one extra repopulation, not a wrong answer.

The root cause is that `CacheError` is asymmetric. `WriteIndeterminate` says "my
bytes may have landed" and nothing says the converse, so `TierUnavailable` and
`Timeout` cannot be read as "they definitely did not". Three tests asserted the
old behaviour on inputs that could not support it and were rewritten; one of them
asserted the bug outright, requiring abort to restore `Ready`.

The same review found the CI fuzz job's shell block had an unmatched `done`, so
the smoke loop was a syntax error and had never run — behind `continue-on-error`,
which is exactly the mechanism designed to hide it.

The two should-fix integrity findings went at the same time. The blanket
`IntegrityCheck` digest hashed through two identically-seeded `DefaultHasher`s, so
its 128 bits were one hash twice; a seeded FNV `Hasher` replaced them. `Cachelito`
identified entries by a bare `u64` that was both slot selector and identity, which
`integrity.rs` had explicitly warned against; `KeyAddress` now splits the two and
`Placement` became injectable, which is what turned `no_cross_key_corruption` in
the control plane from asserted into demonstrated.

Known limitations, in rough order of how much they will bite. Eviction policy:
FixedTierStub reports CapacityExhausted when full and CacheManager degrades down the
ladder, but nothing evicts, so a cache whose whole ladder is full refuses new writes.
Move recovery, as above: a swept move intent stays Prepared forever, which wedges the
population path for that key with no automatic remedy. Both are named in
pending_work rather than worked around.
Six declared invariants have no proving test and are waived with reasons in
[[verification.invariant_waiver]]: unbounded_retry, silent_stale_data_acceptance,
recovering_from_available, blocking_runtime_thread, nested_block_on, and
promotion_eviction_races. Two of those cannot be tested without something the crate
does not have - a blocking backend, and eviction.
The invariant registry proves a test is named and exists, not that it exercises the
clause. That residual limit is a review judgement, and it is the same one
testkit::declare_cases! documents.
CI cannot check its own action refs. Three build steps referenced a tag or a binary
that did not exist and reported success having done nothing - sccache, cargo-fuzz, and
a guessed sccache-action@v0.8. Only executing CI found them, and no local gate can,
because a ref that cannot be resolved is indistinguishable from one that can until
something tries to run it.
The authorship gate reads history through `git log --all`, so it sees only the refs the
clone carries. A commit that is unreachable from every fetched ref - deleted, or left
only in a reflog on another machine - is not scanned. That is the same blind spot the
gate has as any other history check, and it is why the seven rewritten commits needed
a force-push rather than only a local rebase: until the remote ref moved, the gate
correctly kept reporting them.

The last pass closed three gaps that were all the same shape: a declaration nobody was
made responsible for.

CI could not run for this PR at all. Both workflow triggers were filtered to
`branches: [main]`, so a stacked branch produced no checks, no aggregator and no
required status - `main` protection and a branch that cannot raise a check are
independent features that compose into nothing. The trigger is now unfiltered and
main requires exactly one check, `Verification (all gates)`, with `if: always()` on it.
That `if` is load-bearing: without it a failed dependency makes the aggregator
`skipped`, and GitHub scores a skipped required check as passing, so the protection
would have been satisfied by the failure it exists to catch.

The authorship gate arrived by way of its own failure. It forbids attribution
trailers by key, and it caught this repository's own commit messages - including one
added while writing the fix, by habit, in a commit whose whole subject was the
trailer. The rule is on the key and does not read the value, which is the property
that makes it usable: a trailer claiming to attribute nobody is still a trailer. Its
fixtures were then found to be environment-dependent - they set `--author`, which is
only the author, and took the committer from whatever global git config the host
carried. They passed on the developer machine and failed on the runner, in a helper
that piped stderr into a pipe it never read, so the failure said only `git commit
failed`.

The declared-cases gap was the subtler one. `[testing.property].invariants` declares
nine invariants and `[testing.fault_injection].faults` declares twelve faults; both
were checked against a `coverage.rs` name list for set equality, which proves the two
lists agree and not that a test exists. All twenty-one were covered. The property
binding lived in two comments - `// no_deadlock / no_lock_across_await` and
`// no_capability_misreporting / no_false_durability` - so two `proptest!` blocks each
claimed two invariants, and deleting or renaming either left every gate green while
theSix.toml still asserted `no_deadlock`. `PROPERTY_CASE_PROOFS` and
`FAULT_CASE_PROOFS` now bind each declared name to a `path::fn`, which is checked to
exist. Writing that check found that the check itself was defeatable: it matched
`fn <name>` as a substring, so `no_authority_inversion_RENAMED` satisfied a claim on
`no_authority_inversion` - renaming a test aside kept its coverage alive, which is the
most obvious route to defeating the registry being added.
"""

