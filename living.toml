    "Rule 8 matches only cfg and cfg_attr. An early version matched the first attribute of any kind and reported derive and doc as conditional compilation: 490 of 493 sites were false positives, and the count fell to 24 once the predicate was the set of attributes that can actually remove code from a build",
    "A `covers` entry in the contract is an invocation, not a label. `every_declared_gate_is_executed_by_a_ci_job` compares gate names and passed for a job that ran `cargo xtask contract` -- a validator that prints -- while claiming to cover the `contract` gate, so 56 assertions never executed. The new `a_covering_job_actually_invokes_the_gate_it_claims_to_cover` resolves each entry against the job's actual run: blocks, accepting `cargo xtask run <gate>`, a nextest invocation naming the gate's targets, or the matrix form resolved against strategy.matrix. It is a heuristic on YAML, and it has already caught one real hole",
    "`lib` is a gate target and is not a path. --test X selects an integration binary and excludes the lib binary, so the gate named `unit` ran four integration targets and none of the 49 tests inside src/. That is the same class of defect as a gate that reports a pass over nothing: the name was right and the coverage was not",
    "Versions are 0.3.0 (PR2) and 0.4.0 (PR3), not 1.0.0 and 2.0.0. The published version is 0.2.3, and a pre-1.0 crate signals breaking changes by bumping the minor rather than the major. Labelling these 1.0.0 and 2.0.0 would have claimed API stability twice over - once for a release that invalidates every cached key, and again on the next breaking change - and the major numbers would have carried no information a consumer could act on. 0.x keeps the promise honest and leaves 1.0.0 meaning something",
]

