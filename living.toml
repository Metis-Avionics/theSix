    { type = "added", description = "Release order is recorded rather than automated. 0.4.0 publishes only after PR2 (0.3.0) and PR3 are both merged and PR3 is re-reviewed; cargo publish is irreversible, so it is a human step with a dry-run first, not something a session does on finishing a task", scope = "living.toml" },
