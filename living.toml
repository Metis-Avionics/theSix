    "Write-error cleanup is keyed on CacheError::WriteIndeterminate, per operation, NOT on a tier capability flag. Attempted the flag first; a blanket per-tier claim cannot separate a rejected write from an accepted one, so it over-removes and destroys committed values. CapabilityFlags::ATOMIC_WRITE_OR_ERROR is retained as reported capability only",
