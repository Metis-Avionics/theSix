summary = """
0.4.0 backlog pass: findings B15 through B21, with B21 still open and the reason
being that it cannot be fixed from inside this repository.

Six findings closed, and one of them was not a missing test. B15 left a swept
`Move` intent holding a population claim on a `Prepared` entry, which both
`acquire` and the write path decline, so the key's population path was wedged for
the life of the process unless an external reconciler holding the key bytes
happened to arrive. The claim is now released while the intent is deliberately
kept: `Failed` rather than the restored pre-intent state, because restoring would
point the control plane at a source rung the interrupted move had already emptied
and a read would serve that emptiness as a value.

B16's `cia.integrity.silent_stale_data_acceptance` was false rather than unproven.
`refresh` returned a bare `Option<V>`, so a stale fallback was indistinguishable
from a fresh value, and worse, the policy's fail-open mode let the population path
return another rung's value as a successful fetch. `refresh_detailed` now reports
`Freshness`, and `refresh` fails closed on the fetch.

B20 closed the gap the registry documentation had admitted for two reviews: a
locator that resolved proved nothing, so every proving test now declares the clause
it is cited for and a mis-citation fails the gate.

Two compliance defects were found while reconciling the documentation, and neither
is covered by any gate. `SECURITY.md` was GitHub's unmodified placeholder, claiming
support for 5.1.x, 5.0.x and 4.0.x, versions of this crate that have never
existed. It reached `main` because a commit was pushed straight to a feature branch
during this pass and merged unchecked, which is B21's concrete cost rather than a
hypothetical. `CHANGELOG.md` asserted `main` was branch-protected and that the
invariant registry only proved a test existed; both were true when written and are
false now.

The crate is 0.4.0 and unpublished, and the last version on crates.io is 0.2.3.
Nothing has been published from this branch, and `cargo publish --dry-run` has not
been run against the final head.
"""

pending_work = """
# Double entry with bugs.toml, kept deliberately. `pending_work` here holds the
# reasoning and the sequencing; `bugs.toml` holds the tracked status and is what
# `merge_readiness` reads. Each item below names its finding so the two can be
# reconciled by eye. They are not merged into one list because they answer
# different questions: this one asks *why is it hard and what order*, the tracker
# asks *is it done*. B15-B20 are open and non-blocking, so a green
# `merge_readiness` is consistent with every item below still being true.
- **B21. `main` has no required status check, and no gate will notice.** Branch
  protection's `required_status_checks` was switched off to merge PR2 — it predates
  the contract, so its workflow emits no `Verification (all gates)` job, and
  `enforce_admins: true` left no bypass. Every other rule is intact. It must be
  re-enabled the moment the contract workflow is running on `main`, because until then
  any PR can merge without the aggregated gate. This is recorded in three places on
  purpose (`AGENTS.md`, `bugs.toml` B21, and here) precisely because nothing enforces
  it: the finding is non-blocking, so the tracker counts it and does not fail on it.
  The automation token can delete the rule but every create/update path 404s, so it
  needs the web UI or a token with Administration: write.
- **B20.** The residual limit of every proof registry, now stated once and applying to three of
  them. `missing_locators` proves a function of that name is defined in that file. It
  does not prove the function is a test, and it does not prove the test exercises the
  clause it is cited for. A row pointing at a real but irrelevant function passes.
  Closing this needs the instrument the fault layer already has - assert that the
  injected fault actually fired, per row - rather than a better string match.
- **B19.** An unverified concurrency caveat, carried forward and never closed: `peek` observes
  without claiming, and `CacheTier::get` returns a bare `V`, so a value read from a
  rung across an `await` cannot be revalidated against the generation it was read at.
  If an abort lands in that window the caller holds a value the control plane has
  stopped describing. Either `get` needs to return something carrying its generation,
  or the read path needs a post-read generation check. It needs a test that forces the
  interleaving, which is why it is written here rather than described as safe.
- **B15.** Move recovery needs a real answer. `theSix.toml` declares
  `recovery_direction_prepare_move = "external-reconciliation"` and the runtime
  implements exactly that, so the contract and the code agree — but the consequence is
  that a swept Move intent stays `Prepared` forever, with `population_owner = true`,
  which wedges the population path for that key and has no automatic remedy. Two ways
  out, both contract changes rather than patches:
    (a) persist the key bytes, or a durable handle to them, in `CommitIntent`, which
        collides with the payload-free intent invariant;
    (b) reorder the move so the commit precedes the source removal, then let the sweep
        abort. That makes abort always safe, because a crash before the commit leaves
        the source intact and a crash after it leaves only an unreachable duplicate.
        Needs a test that pins the reorder, and a decision on whether `CommitIntent`
        may reference key material at all.
- CI now runs for every PR, and `tests/contract` parses `.github/workflows/ci.yml`
  to hold the workflow and the contract to each other in both directions, including
  a `bash -n` lint over every `run:` block. What it does not do is resolve the
  action refs: three separate build steps referenced a tag or a binary that did not
  exist (B11's sccache, B14's cargo-fuzz, and a guessed `sccache-action@v0.8`), each
  reporting success while doing nothing. Only executing CI found them. A ref that
  cannot be resolved is invisible to every local gate, and the nearest local
  approximation — grepping for the tool in the file — would pass on all three.
- **B18.** The `sccache-action`, `cargo-deny-action` removal and `rust-toolchain@stable` refs
  are pinned variously by SHA and by version tag. Seven of the eight action
  references in the workflow are tags; only `sccache-action` is SHA-pinned. SHA-pinning every action is the
  consistent end state; the SHAs resolve the same way this one did, it has just not
  been done for all of them.
- **B16.** The waived invariants are the honest remainder of the audit. Four of the original six
  were closed in the 0.4.0 backlog pass and are the next
  thing worth closing. Two of the six are not test-authoring work: one needs a
  genuinely blocking backend, the other is blocked on **B17**. `unbounded_retry` (nothing counts retries), `silent_stale_data_
  acceptance` (nothing distinguishes silent from explicit stale service),
  `recovering_from_available` (the state exists, no test drives a rung into it),
  `blocking_runtime_thread` and `nested_block_on` (nothing in the suite can catch
  either, since every tier is an in-process stub), and `promotion_eviction_races`
  (blocked on eviction not existing).
- Extend the non-vacuity discipline past bugs.toml. `bugs.toml` is enforced by a gate;
  the contract's own prose clauses, the `decisions` list below, and the `remaining`
  list are not. Nothing fails when one of them goes stale.
- **B17.** Eviction policy for fixed-capacity tiers. CapacityExhausted plus ladder degradation
  is honest but lossy: a cache with no eviction stops accepting writes once its ladder
  fills. There is no `evict` in `src/` at all — this is a policy decision the contract
  leaves to the consumer, not an unfinished loop. Not attempted here because it is a policy choice (LRU, sampled, clock) and the
  contract deliberately leaves policy to the consumer.
- Durable backing for the authority rung. L6 has no in-tree implementation, so the
  authority is currently a configured role with no binding. DurabilityClass::Verified
  therefore has no rung that earns it yet.
- read_repair / reconciliation. ContinuityState::Reconciling is representable and
  reported, but nothing drives it: there is no pass that compares a rung against the
  authority and repairs drift.
- Atomic multi-key operations. The commit protocol is per-entry. A caller wanting
  "these twenty keys or none" still needs to coordinate outside the crate.
- Streaming / non-ByteValue payloads. Integrity framing covers the fixed tier stub
  (via IntegrityCheck) and the byte-oriented backends (via an explicit frame), but a
  payload that cannot produce a digest has no integrity story.
- Wall clock, for whoever cares: the 26 gates take ~54s warm, and `loom` alone is 27.6s
  of that — 51%. Every real test binary combined is about 5s for 263 tests, so there
  is no test-level speedup available; sccache, nextest and the GH cache already cover
  compilation. The one lever that exists is narrowing loom's bound or moving it off the
  mandatory path, which trades away exhaustive interleavings and so is a judgement
  call rather than a free win. Do not "optimise" this by caching gate verdicts: a
  replayed verdict is the same defect as B5 one level up.
"""

