decisions = [
    "Branch protection requires ONE check, `Verification (all gates)`, rather than the individual jobs. `test` is a 10-leg matrix reporting `Tests (unit)`-style names, so a required-check list built from job names silently stops matching when the layer list changes. One aggregator with `if: always()` has no such failure mode, and tests/contract asserts every non-advisory job is in its `needs` so a new job cannot quietly run outside the aggregate. `if: always()` is load-bearing and separately asserted: without it a failed dependency makes the aggregator skipped, and GitHub scores a skipped required check as passing",
    "Invariant proofs live in testkit and invariant waivers live in theSix.toml. Duplicating the pairs into both files would recreate the self-graded-tracker defect one level down: the test side owns what its tests cover, the contract side owns what is admitted to be unverified, and tests/contract requires the union of the two to equal the declared set exactly",
    "`check` and `clippy` take --workspace. Both previously linted only the root package, so the gate runner and test harness were never covered, and four warnings had accumulated in xtask with no gate noticing. A gate that claims to cover the repository should ask the tool to cover the repository",
    "sccache stays in the committed .cargo/config.toml and CI installs it explicitly, rather than removing the wrapper. Local and CI should compile the same way, and the cache is worth having on the overlapping feature matrix. What changed is that the dependency is now declared in the file that needs it and in every job that uses it, instead of being inherited invisibly from a developer machine",
    "The six waived invariants are listed rather than quietly given proofs. Naming a test that does not exercise the clause would satisfy the gate and is exactly the over-promise this contract exists to prevent, so a visible waiver with a reason is the honest artefact",
    "B23 widened the proof obligation to nine contract sections. verification.every_invariant_has_a_proof_or_waiver is declared and proven by the audit that enforces it, so the obligation is the one rule the system can no longer quietly exempt itself from. 45 clauses in [verification] and [engineering] were previously unbindable by any gate; 31 bound to tests that already existed and 14 needed new ones. Three engineering.design.* claims moved to a top-level [design] table outside the proof-bound set, because there is no mechanical form for them and a fake proof is worse than an admitted limit. 140 leaves, 139 proofs, 1 waiver",
    "CacheTier is async via #[async_trait], not native AFIT: the trait is held as Arc<dyn CacheTier<V>> and AFIT is not dyn-compatible",
    "The control plane stays SYNCHRONOUS. Cachelito is a pre-allocated sharded slot map whose acquire() returns an owned ControlSnapshot, so no shard guard is alive across an await. tests/await_safety.rs proves it rather than asserting it, and a companion test proves the watchdog would notice a block",
    "DashMap rejected for the control plane and for tier storage: it allocates after init (Rule 3) and its caller-chosen guard lifetime deadlocks a shard when held across an await - which is precisely the pattern the async trait makes possible",
    "L3/L4/L5 became working in-memory fallbacks rather than error returns, and report BackendKind::InMemoryFallback so a stand-in can never read as the tier it substitutes for",
    "A capability report must correspond to working behaviour. An intermediate version reported InMemoryFallback for tiers that still refused everything; reported_fallbacks_actually_store now drives a round-trip through each upper rung",
    "CacheTier::backend() is REQUIRED in 1.0 rather than defaulted: a tier that cannot say what it is cannot be reported on",
    "L6 is authority, excluded from the ladder via a named policy::LAST_CACHE_TIER, and enforced by tripwires upstream as well as downstream",
    "Values travel through the Oxigraph backend as hex, not String::from_utf8_lossy: the lossy path replaced every invalid byte with U+FFFD and corrupted binary payloads silently",
    "cargo deny all-features advisories on quick-xml 0.37.5 (RUSTSEC-2026-0194/0195) are ignored with a reason rather than left to fail CI: the crate is pinned by oxrdfxml below the patched 0.41.0, and cargo tree shows zero quick-xml nodes for the default set, for --features oxigraph, and for --features redis,sled,oxigraph. It appears only under --all-features, and L5OxigraphBackend never parses XML. Local advisory-db was a month stale, which is why this passed locally and failed in CI - refresh it before trusting a deny gate",
    "A poisoned-shard handler exists but is unreachable through the public API, because every guard is scoped inside a method and released before returning. Recorded rather than asserted",
    "A cancelled set is released by an RAII IntentGuard rather than by a compensation path, because Drop is the only construct that runs on every exit path including a dropped future. Deliberately NOT a rollback of the data write: if tier.set completed and the future died before commit, the value is on the rung and the intent is gone, and recovery cannot distinguish that from an abort. The tier read path consults the control plane first, so the value is unreachable, which is what partial_commit_visible claims",
    "Write-error cleanup is keyed on CacheError::WriteIndeterminate, per operation, NOT on a tier capability flag. Attempted the flag first; a blanket per-tier claim cannot separate a rejected write from an accepted one, so it over-removes and destroys committed values. CapabilityFlags::ATOMIC_WRITE_OR_ERROR is retained as reported capability only",
    "theSix.toml, not bugs.toml, holds the expected finding counts the merge_readiness gate checks. A tracker that declares its own expected contents can be emptied or downgraded to make the gate pass, and both happened before the count check existed",
    "Abort of a write with an unknown outcome does NOT restore the pre-intent state; it leaves the entry Failed and advances the generation. Only abort_proven_clean restores, and only for SerializationFailed and CapacityExhausted. Restoring over a rung of unknown contents is how an uncommitted value became readable, and the cost of not restoring is one repopulation rather than a wrong answer",
    "Control-plane identity is a 128-bit KeyFingerprint and placement is a separate 64-bit hash, bundled as KeyAddress so no call site can hold one without the other. Placement is injectable in Cachelito as well as the stub, which is what makes no_cross_key_corruption demonstrable in the control plane instead of merely declared",
    "Move recovery was resolved by redefining the contract rather than by implementing the recovery, on the grounds that persisting key bytes in CommitIntent violates the payload-free intent invariant. This is the one place the contract was changed to match reality instead of the reverse, and it is recorded as such rather than presented as a fix",
    "Declared cases are bound to proving tests by a path::fn table, not by matching names. `[testing.property].invariants` and `[testing.fault_injection].faults` are declared with names that do not match the tests that prove them - descriptive test names are worth more than contract-shaped ones - so the correspondence cannot be derived and has to be written down. `declare_cases!` was not extended to cover this: it emits #[tokio::test], these are proptest! blocks, and the property mapping is one-to-many",
    "The locator check is word-bounded, not substring. `fn no_authority_inversion_RENAMED` satisfied a claim on `no_authority_inversion`, so renaming a test aside kept its coverage claim alive - the most obvious way to defeat the registry that was being added to prevent exactly that",
    "The authorship gate's rule is on the trailer KEY and never reads the value. That is what makes it usable: a trailer attributing nobody is still a trailer, and the gate caught this repository's own history, including one written by habit while committing the fix. Fixtures set an explicit committer identity via -c user.name/-c user.email, because --author sets only the author and the committer was otherwise inherited from the host's global git config - which is why the suite passed locally and failed on the runner",
    "A gate is not done when it passes locally. The authorship fixtures failed only in CI, and the helper discarded stderr, so the failure said `git commit failed` and nothing else. The helper now reports stderr, on the same reasoning as B8: a check whose failure mode is silent is not a check",
    "Caching gate verdicts was considered and rejected. A replayed verdict is the B5 defect one level up - something that reads as the gate without being it - and it would make a 54s matrix unauditable. The gate matrix is already dominated by loom (27.6s of 54s), not by test execution (~5s for 263 tests), so there is no test-level speedup to buy",
    "Versions are 0.3.0 (PR2) and 0.4.0 (PR3), not 1.0.0 and 2.0.0. The published version is 0.2.3, and a pre-1.0 crate signals breaking changes by bumping the minor rather than the major. Labelling these 1.0.0 and 2.0.0 would have claimed API stability twice over - once for a release that invalidates every cached key, and again on the next breaking change - and the major numbers would have carried no information a consumer could act on. 0.x keeps the promise honest and leaves 1.0.0 meaning something",
]

