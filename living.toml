[[handover.open_decisions.item]]
id = "D5"
question = "B32: rule 7 is titled no-check-then-act and cannot detect check-then-act. Rename it, or implement dataflow?"
options = [
    "Rename the rule to what it measures -- a conditional must not leave one branch diverging while the other yields -- and let the concurrency layer own TOCTOU, where B19 and B22 already live.",
    "Implement flow sensitivity: bind the operands a check reads, and require every subsuming access to re-read them. This is a real dataflow analysis, not a predicate.",
    "Leave the title and add a third disposition for a rule whose predicate cannot reach its own title, so the gap is machine-visible rather than prose.",
]
recommendation = "Rename. The rule as titled is a good rule and the crate follows it -- via the control plane, via OwnershipCommitProtectsKeyBeforeDrop, and via two named findings with reproductions. The predicate is a cheap approximation of it. Renaming keeps ten rules that are honestly described instead of nine plus a clause that reads as a check and is not. The concurrency layer is where TOCTOU actually gets enforced here, and pretending a syntactic early-return detector is the enforcement is the exact over-promise this contract exists to prevent."
blocks = "a change to what the standard claims"
