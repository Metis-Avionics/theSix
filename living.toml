in one pass, driven by a clap CLI, with nextest, sccache, Swatinem/rust-cache and
any optimisations available, and for the appropriate invariants turned into local
gates and CI gates. That produced theSix.toml as the source of truth, cargo xtask
as the gate runner, ten new test layers, and the machinery that found the defects
listed in bugs.toml.

An external review of the result found three blocking findings, all real, and the
work of this session's end was closing them - see the handover summary above for
what each was and why two of the three fixes are not the obvious ones.
"""
