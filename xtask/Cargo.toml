[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Gate runner and contract validator for theSix."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Depends on the crate it verifies so the contract's fault taxonomy can be
# cross-checked against the real `FaultClass::ALL` rather than a copy that
# would drift.
thesix = { path = "..", features = ["faults"] }
